compressionLevel: mixed

enableGlobalCache: false

# Newer Yarn 4 releases (4.19 here, unlike 4.12) default enableScripts to false. Puppeteer
# needs its postinstall to download Chrome for the a11y tests (see
# Jenkinsfile_CNP: yarn rebuild puppeteer), as do edgedriver and geckodriver.
enableScripts: true

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.19.0.cjs
